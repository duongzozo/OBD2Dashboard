name: OBD2Dashboard
options:
  bundleIdPrefix: com.diy.obd2dashboard
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  OBD2Dashboard:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Simulator
      - path: Resources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "OBD-II Dashboard Pro"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSBluetoothAlwaysUsageDescription: "OBD-II Dashboard Pro needs Bluetooth to connect to your ELM327 OBD-II adapter."
        NSBluetoothPeripheralUsageDescription: "OBD-II Dashboard Pro needs Bluetooth to connect to your ELM327 OBD-II adapter."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diy.obd2dashboard.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - OBD2DashboardTests
      gatherCoverageData: true

  OBD2DashboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Tests
    dependencies:
      - target: OBD2Dashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diy.obd2dashboard.tests
