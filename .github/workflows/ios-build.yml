name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinning to an older Xcode (e.g. 15.4) causes a version-skew failure:
      # Homebrew always installs the latest XcodeGen, which writes project
      # files in whatever pbxproj format its current release defaults to —
      # an old pinned Xcode may be unable to open a newer format. Using the
      # runner's latest stable Xcode keeps generator and IDE in lockstep.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, ARM64 device SDK)
        run: |
          xcodebuild build \
            -project OBD2Dashboard.xcodeproj \
            -scheme OBD2Dashboard \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project OBD2Dashboard.xcodeproj \
            -scheme OBD2Dashboard \
            -destination 'platform=iOS Simulator,name=iPad (10th generation)'

      - name: Archive unsigned IPA
        run: |
          xcodebuild archive \
            -project OBD2Dashboard.xcodeproj \
            -scheme OBD2Dashboard \
            -sdk iphoneos \
            -archivePath build/OBD2Dashboard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -R build/OBD2Dashboard.xcarchive/Products/Applications/OBD2Dashboard.app build/Payload/
          cd build && zip -r OBD2Dashboard-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBD2Dashboard-unsigned-ipa
          path: build/OBD2Dashboard-unsigned.ipa
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
